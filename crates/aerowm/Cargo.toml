[package]
name = "aerowm"
version = "0.1.0"
edition = "2024"
description = "AeroWM: High-performance Wayland dynamic tiling window manager"

[dependencies]
aerowm-core = { version = "0.1.0", path = "../aerowm-core" }
aerowm-ipc = { version = "0.1.0", path = "../aerowm-ipc" }
aerowm-lua = { version = "0.1.0", path = "../aerowm-lua" }
calloop = "0.14.4"
serde_json = "1.0.151"
smithay = { version = "0.7.0", features = ["desktop", "wayland_frontend", "renderer_gl", "backend_winit", "backend_drm", "backend_gbm", "backend_egl", "backend_libinput", "backend_session", "backend_session_libseat", "backend_udev", "use_system_lib"] }
xkbcommon = "0.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wayland-server = "0.31.14"

[features]
default = []
# Legacy X11 application support via XWayland. Off by default so pure
# Wayland installs skip the x11rb stack and the XWayland runtime entirely.
xwayland = ["smithay/xwayland"]
