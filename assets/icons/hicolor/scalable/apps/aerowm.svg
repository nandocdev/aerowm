<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73659"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a5276"/>
    </linearGradient>
    <linearGradient id="tile3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#533483"/>
      <stop offset="100%" style="stop-color:#7b2d8b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="16" ry="16" fill="url(#bg)"/>

  <!-- Tiling window layout -->
  <!-- Left column: two stacked tiles -->
  <rect x="16" y="20" width="44" height="40" rx="4" ry="4" fill="url(#tile1)"/>
  <rect x="16" y="68" width="44" height="40" rx="4" ry="4" fill="url(#tile2)"/>

  <!-- Right column: one large tile -->
  <rect x="68" y="20" width="44" height="88" rx="4" ry="4" fill="url(#tile3)"/>

  <!-- Window decorations - title bars -->
  <rect x="20" y="24" width="36" height="6" rx="2" ry="2" fill="#ffffff" opacity="0.3"/>
  <rect x="20" y="72" width="36" height="6" rx="2" ry="2" fill="#ffffff" opacity="0.3"/>
  <rect x="72" y="24" width="36" height="6" rx="2" ry="2" fill="#ffffff" opacity="0.3"/>

  <!-- Accent line -->
  <rect x="16" y="60" width="96" height="2" fill="url(#accent)" opacity="0.6"/>
</svg>
